# Ollama / OpenAI 互換 API 接続設定
# Outpatient-Dashboard と同じパターン。
# Phase A.0 実績: hf.co/mmnga/Llama-3.1-Swallow-8B-Instruct-v0.5-gguf:Q6_K で 100% 採用率・3.4s/件

endpoint: "http://localhost:11434/v1/chat/completions"
model: "hf.co/mmnga/Llama-3.1-Swallow-8B-Instruct-v0.5-gguf:Q6_K"

# カテゴリ多ラベル分類用デフォルトパラメータ
# 単純多ラベル分類なので低温度で安定出力を狙う
temperature: 0.1
max_tokens: 200
timeout: 60

# Ollama API には system prompt は送るが、Llama 3.1 系は system 軽視傾向のため
# 最小限とし、出力規約は user prompt 側で繰り返す
system_prompt: |
  あなたは外科手術データのカテゴリ分類アシスタントです。
  与えられた術式名から該当カテゴリを多ラベル形式で判定してください。
  数値・推測・コメントを一切付け加えず、指定された出力規約に厳密に従ってください。
