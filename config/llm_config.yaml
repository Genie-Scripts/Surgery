# oMLX (OpenAI 互換 API) 接続設定
# Outpatient-Dashboard と同じパターン。要約/分類 LLM は oMLX に一本化。
# 認証は OMLX_API_KEY env or ~/.omlx/settings.json の auth.api_key を Bearer で送る（llm_client が解決）。
# モデルは oMLX 配信 id と完全一致が必須（旧 Ollama の hf.co/...:Q6_K タグ名は 404 になる）。

endpoint: "http://localhost:8000/v1/chat/completions"
model: "Llama-3.1-Swallow-8B-Instruct-v0.5"

# カテゴリ多ラベル分類用デフォルトパラメータ
# 単純多ラベル分類なので低温度で安定出力を狙う
temperature: 0.1
max_tokens: 200
timeout: 60

# oMLX(OpenAI互換) には system prompt を送るが、Llama 3.1 系は system 軽視傾向のため
# 最小限とし、出力規約は user prompt 側で繰り返す
system_prompt: |
  あなたは外科手術データのカテゴリ分類アシスタントです。
  与えられた術式名から該当カテゴリを多ラベル形式で判定してください。
  数値・推測・コメントを一切付け加えず、指定された出力規約に厳密に従ってください。
