# PDF レポート (src/export_pdf.py) の Page 2「全麻手術件数 vs 目標」で使用する。
# 未設定の診療科は、週次グラフで目標横線・達成率を出さず実績のみ描画する。
#
# 形式:
#   <診療科名>:
#     weekly_general_anesthesia: <int>   # 週あたり目標件数
