# 手術室 → ダヴィンチ機種の対応表（部屋固定・据え置きの確定条件）
#
# 機種は手術室で一意に決まる:
#   ＯＰ－２（全角）= ダヴィンチ SP
#   ＯＰ－９（全角）= ダヴィンチ Xi
#
# OR2 / OR9 ではダヴィンチを使わない通常手術も行うため、機種使用の判定は
# 「ダヴィンチ症例フラグ（確定術式に『手術用支援』を含む = robot_assisted_davinci）
#  AND この対応表の手術室」の AND 条件で行う（部屋だけで数えると過大計上）。
#
# キーは `実施手術室` 列の値と完全一致（全角）。機種を増設・移設したらここを更新する。
# 値は PDF の凡例・見出しに表示されるラベル。

ＯＰ－２: ダヴィンチSP
ＯＰ－９: ダヴィンチXi
